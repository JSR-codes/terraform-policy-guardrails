# Guardrail settings for prod, loaded by conftest as data.guardrails
guardrails:
  environment: prod
  allowed_regions: [us-east-1, us-west-2]
  required_tags: [Project, Environment, Owner, CostCenter]
  require_kms_for_s3: true
  require_versioning: true
  min_azs: 3
  min_kms_deletion_window_days: 30
  protect_stateful_resources: true
  public_ingress_ports: [443]
  allowed_instance_types: [m7i.large, m7i.xlarge, m7g.large, m7g.xlarge, c7i.large, r7i.large]
