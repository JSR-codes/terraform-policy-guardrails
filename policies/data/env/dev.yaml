# Guardrail settings for dev, loaded by conftest as data.guardrails
guardrails:
  environment: dev
  allowed_regions: [us-east-1]
  required_tags: [Project, Environment, Owner, CostCenter]
  require_kms_for_s3: true
  require_versioning: true
  min_azs: 2
  min_kms_deletion_window_days: 7
  protect_stateful_resources: false
  public_ingress_ports: [80, 443]
  allowed_instance_types: [t3.micro, t3.small, t3.medium, t4g.micro, t4g.small, t4g.medium]
